<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 250" role="img" aria-label="Замкнутый цикл DOOM" xmlns="http://www.w3.org/2000/svg" width="900" height="250">
<style>
.box{fill:#f8fafb;stroke:#3d4954;stroke-width:1.4}
.box-cpu{fill:#d7e0ee;stroke:#2b4b7a;stroke-width:1.6}
.box-mem{fill:#dbe7d2;stroke:#4a6b3a;stroke-width:1.6}
.box-doom{fill:#f0d7dd;stroke:#a8324a;stroke-width:1.6}
.box-snake{fill:#f0e2c4;stroke:#9a6a00;stroke-width:1.6}
.box-acc{fill:#d3e7ea;stroke:#0e6f7e;stroke-width:1.6}
.lbl{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:650}
.lbl-s{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.mono{fill:#3d4954;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace}
.mono-i{fill:#141a21;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;font-weight:600}
.wire{stroke:#3d4954;stroke-width:1.5;fill:none}
.wire-doom{stroke:#a8324a;stroke-width:2;fill:none}
.wire-snake{stroke:#9a6a00;stroke-width:2;fill:none}
.wire-acc{stroke:#0e6f7e;stroke-width:2;fill:none}
.tick{stroke:#3d4954;stroke-width:1.3;fill:none}
</style>
<rect x="0" y="0" width="900" height="250" fill="#eef1f4"/>

  <rect class="box-mem" x="30" y="40" width="150" height="56" rx="9"/>
  <text class="lbl-s" x="105" y="63" text-anchor="middle" font-size="11.5">WAD в DDR</text>
  <text class="mono" x="105" y="80" text-anchor="middle" font-size="9.5">.incbin, читается</text>

  <rect class="box-cpu" x="240" y="40" width="180" height="56" rx="9"/>
  <text class="lbl" x="330" y="63" text-anchor="middle" font-size="12">DOOM-движок</text>
  <text class="mono" x="330" y="80" text-anchor="middle" font-size="9.5">рендер кадра 320×200</text>

  <rect class="box-doom" x="490" y="40" width="180" height="56" rx="9"/>
  <text class="lbl-s" x="580" y="63" text-anchor="middle" font-size="11.5">fb_blit8 → FB+палитра</text>
  <text class="mono" x="580" y="80" text-anchor="middle" font-size="9.5">0xFF04 / 0xFF05</text>

  <rect class="box-acc" x="720" y="40" width="150" height="56" rx="9"/>
  <text class="lbl-s" x="795" y="63" text-anchor="middle" font-size="11.5">vga_fb → монитор</text>
  <text class="mono" x="795" y="80" text-anchor="middle" font-size="9.5">640×480@60</text>

  <g class="wire-doom"><path d="M180 68 H240"/><path d="M420 68 H490"/><path d="M670 68 H720"/></g>

  <!-- input loop back -->
  <rect class="box" x="490" y="160" width="180" height="56" rx="9"/>
  <text class="lbl-s" x="580" y="183" text-anchor="middle" font-size="11.5">SCR1_KbdPump</text>
  <text class="mono" x="580" y="200" text-anchor="middle" font-size="9.5">PS/2 FIFO → клавиши</text>
  <rect class="box-snake" x="240" y="160" width="180" height="56" rx="9"/>
  <text class="lbl-s" x="330" y="183" text-anchor="middle" font-size="11.5">игровая логика</text>
  <text class="mono" x="330" y="200" text-anchor="middle" font-size="9.5">движение/стрельба</text>

  <path class="wire" d="M490 188 H420"/>
  <path class="wire" d="M240 188 H150 V96" stroke-dasharray="5 3"/>
  <text class="mono" x="120" y="150" text-anchor="middle" font-size="9.5">кадр за кадром</text>
  <path class="wire-doom" d="M330 96 V160" stroke-dasharray="5 3"/>
</svg>