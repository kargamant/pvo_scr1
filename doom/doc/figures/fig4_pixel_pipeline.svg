<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 210" role="img" aria-label="Конвейер вывода пикселя" xmlns="http://www.w3.org/2000/svg" width="920" height="210">
<style>
.box{fill:#f8fafb;stroke:#3d4954;stroke-width:1.4}
.box-cpu{fill:#d7e0ee;stroke:#2b4b7a;stroke-width:1.6}
.box-mem{fill:#dbe7d2;stroke:#4a6b3a;stroke-width:1.6}
.box-doom{fill:#f0d7dd;stroke:#a8324a;stroke-width:1.6}
.box-snake{fill:#f0e2c4;stroke:#9a6a00;stroke-width:1.6}
.box-acc{fill:#d3e7ea;stroke:#0e6f7e;stroke-width:1.6}
.lbl{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:650}
.lbl-s{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.mono{fill:#3d4954;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace}
.mono-i{fill:#141a21;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;font-weight:600}
.wire{stroke:#3d4954;stroke-width:1.5;fill:none}
.wire-doom{stroke:#a8324a;stroke-width:2;fill:none}
.wire-snake{stroke:#9a6a00;stroke-width:2;fill:none}
.wire-acc{stroke:#0e6f7e;stroke-width:2;fill:none}
.tick{stroke:#3d4954;stroke-width:1.3;fill:none}
</style>
<rect x="0" y="0" width="920" height="210" fill="#eef1f4"/>

  <g>
    <rect class="box-acc" x="20" y="70" width="130" height="66" rx="9"/>
    <text class="lbl" x="85" y="98" text-anchor="middle" font-size="12.5">vga_timing</text>
    <text class="mono" x="85" y="116" text-anchor="middle" font-size="10">sx, sy, active</text>

    <rect class="box" x="190" y="70" width="150" height="66" rx="9"/>
    <text class="lbl-s" x="265" y="94" text-anchor="middle" font-size="11.5">адрес пикселя</text>
    <text class="mono" x="265" y="112" text-anchor="middle" font-size="9.5">px=sx/2, py=(sy−40)/2</text>
    <text class="mono" x="265" y="126" text-anchor="middle" font-size="9.5">idx = py·320 + px</text>

    <rect class="box-doom" x="380" y="70" width="150" height="66" rx="9"/>
    <text class="lbl-s" x="455" y="94" text-anchor="middle" font-size="11.5">чтение BRAM</text>
    <text class="mono" x="455" y="112" text-anchor="middle" font-size="9.5">word = fb[idx&gt;&gt;2]</text>
    <text class="mono" x="455" y="126" text-anchor="middle" font-size="9.5">lane = idx[1:0]</text>

    <rect class="box" x="570" y="70" width="150" height="66" rx="9"/>
    <text class="lbl-s" x="645" y="94" text-anchor="middle" font-size="11.5">выбор байта</text>
    <text class="mono" x="645" y="112" text-anchor="middle" font-size="9.5">pidx = word[lane·8 +:8]</text>

    <rect class="box-mem" x="760" y="70" width="140" height="66" rx="9"/>
    <text class="lbl-s" x="830" y="94" text-anchor="middle" font-size="11.5">палитра→RGB</text>
    <text class="mono" x="830" y="112" text-anchor="middle" font-size="9.5">vga_r/g/b (4·3 бит)</text>
  </g>
  <g class="wire-doom">
    <path d="M150 103 H190"/><path d="M340 103 H380"/><path d="M530 103 H570"/><path d="M720 103 H760"/>
  </g>
  <text class="mono" x="460" y="180" text-anchor="middle" font-size="10.5">HS/VS и признак «внутри картинки» едут по тем же ступеням, чтобы цвет совпал с синхро-импульсами</text>
</svg>