<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 240" role="img" aria-label="Кадр PS/2 и путь до FIFO" xmlns="http://www.w3.org/2000/svg" width="900" height="240">
<style>
.box{fill:#f8fafb;stroke:#3d4954;stroke-width:1.4}
.box-cpu{fill:#d7e0ee;stroke:#2b4b7a;stroke-width:1.6}
.box-mem{fill:#dbe7d2;stroke:#4a6b3a;stroke-width:1.6}
.box-doom{fill:#f0d7dd;stroke:#a8324a;stroke-width:1.6}
.box-snake{fill:#f0e2c4;stroke:#9a6a00;stroke-width:1.6}
.box-acc{fill:#d3e7ea;stroke:#0e6f7e;stroke-width:1.6}
.lbl{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:650}
.lbl-s{fill:#141a21;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.mono{fill:#3d4954;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace}
.mono-i{fill:#141a21;font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;font-weight:600}
.wire{stroke:#3d4954;stroke-width:1.5;fill:none}
.wire-doom{stroke:#a8324a;stroke-width:2;fill:none}
.wire-snake{stroke:#9a6a00;stroke-width:2;fill:none}
.wire-acc{stroke:#0e6f7e;stroke-width:2;fill:none}
.tick{stroke:#3d4954;stroke-width:1.3;fill:none}
</style>
<rect x="0" y="0" width="900" height="240" fill="#eef1f4"/>

  <!-- frame bits -->
  <g font-family="ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11">
    <rect x="20" y="30" width="52" height="40" class="box"/>
    <text class="mono-i" x="46" y="55" text-anchor="middle">старт</text>
    <g>
      <rect x="72" y="30" width="52" height="40" class="box-doom"/><text class="mono-i" x="98" y="55" text-anchor="middle">d0</text>
      <rect x="124" y="30" width="52" height="40" class="box-doom"/><text class="mono-i" x="150" y="55" text-anchor="middle">d1</text>
      <rect x="176" y="30" width="52" height="40" class="box-doom"/><text class="mono-i" x="202" y="55" text-anchor="middle">…</text>
      <rect x="228" y="30" width="52" height="40" class="box-doom"/><text class="mono-i" x="254" y="55" text-anchor="middle">d7</text>
    </g>
    <rect x="280" y="30" width="60" height="40" class="box-snake"/><text class="mono-i" x="310" y="55" text-anchor="middle">parity</text>
    <rect x="340" y="30" width="52" height="40" class="box"/><text class="mono-i" x="366" y="55" text-anchor="middle">стоп</text>
  </g>
  <text class="mono" x="206" y="90" text-anchor="middle" font-size="10.5">LSB → MSB, нечётная чётность, выборка по спаду PS2_CLK</text>

  <!-- pipeline -->
  <g transform="translate(0,120)">
    <rect class="box" x="20" y="20" width="150" height="60" rx="9"/>
    <text class="lbl-s" x="95" y="44" text-anchor="middle" font-size="11.5">2-FF синхр. + </text>
    <text class="lbl-s" x="95" y="60" text-anchor="middle" font-size="11.5">фильтр помех (8)</text>

    <rect class="box-acc" x="210" y="20" width="160" height="60" rx="9"/>
    <text class="lbl" x="290" y="42" text-anchor="middle" font-size="12">ps2_rx.sv</text>
    <text class="mono" x="290" y="60" text-anchor="middle" font-size="9.5">сборка кадра + watchdog</text>
    <text class="mono" x="290" y="73" text-anchor="middle" font-size="9.5">→ scancode + strobe</text>

    <rect class="box-mem" x="410" y="20" width="150" height="60" rx="9"/>
    <text class="lbl-s" x="485" y="44" text-anchor="middle" font-size="11.5">FIFO 16 байт</text>
    <text class="mono" x="485" y="61" text-anchor="middle" font-size="9.5">overflow-флаг</text>

    <rect class="box" x="600" y="20" width="170" height="60" rx="9"/>
    <text class="lbl-s" x="685" y="40" text-anchor="middle" font-size="11.5">AXI4-Lite @0xFF03</text>
    <text class="mono" x="685" y="57" text-anchor="middle" font-size="9.5">STATUS 0x00 · DATA 0x04</text>
    <text class="mono" x="685" y="70" text-anchor="middle" font-size="9.5">чтение DATA = pop</text>

    <g class="wire"><path d="M170 50 H210"/><path d="M370 50 H410"/><path d="M560 50 H600"/></g>
  </g>
</svg>